<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI USTYLE</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #111827;
      }
      main {
        max-width: 720px;
        margin: 64px auto;
        padding: 32px 24px;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,.04);
      }
      h1 { margin-top: 0; font-size: 32px; }
      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: #eef2ff;
        color: #3730a3;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .04em;
      }
      ul { line-height: 1.8; }
      code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">AI-USTYLE</div>
      <h1>ai-ustyle.co.jp</h1>
      <p>新規分離した Cloudflare 作業用の最小土台です。</p>
      <ul>
        <li>既存案件とは混同しない</li>
        <li>Cloudflare / GitHub 操作は <code>guard -- ...</code> 前提</li>
        <li>custom domain / route / bindings はまだ未接続</li>
      </ul>
      <p>疎通確認は <code>/healthz</code> を使います。</p>
    </main>
  </body>
</html>
