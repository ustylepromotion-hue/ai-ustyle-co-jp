name = "ai-ustyle-co-jp-worker"
main = "src/worker.js"
compatibility_date = "2026-07-07"

# guard安全優先: route / custom domain は未設定のままにしてある
# この段階では既存案件に触れないため、bindings / routes / vars も未接続

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ai-ustyle-marunage-chat"
database_id = "4474aece-1535-4a1e-8bc5-754863f07ec4"

[observability]
enabled = true

# チャットAPIのIP単位レート制限（WAFの rate limiting rules と同じ基盤・ロケーションローカル）。
# 10リクエスト / 60秒 / 1IP。binding が無い環境ではコード側がフェイルオープンする。
[[ratelimits]]
name = "CHAT_RATE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
